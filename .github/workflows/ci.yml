name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Test
        run: swift test

      - name: Python Hook Installer Tests
        run: python3 scripts/test_hooks.py

      - name: Build Release Bundle
        run: ./scripts/build.sh

      - name: Verify Bundle Signature & Packaging
        run: |
          codesign --verify --deep --strict "dist/Notch Ping.app"
          test -f "dist/Notch Ping.app/Contents/Resources/Lucide-LICENSE.txt"
          test -x "dist/Notch Ping.app/Contents/MacOS/NotchPing"
          test -x "dist/Notch Ping.app/Contents/MacOS/notch-relay"
