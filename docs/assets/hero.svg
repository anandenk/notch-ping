<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Notch Ping macOS notch indicator and session dropdown">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B101B"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1320"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#34D399" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B101B" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Reusable Lucide Bot glyph (24x24 viewBox coordinates, ISC License) -->
    <g id="lucideBot" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2"/>
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
      <path d="M15 13v2"/>
      <path d="M9 13v2"/>
    </g>
  </defs>

  <!-- Outer frame -->
  <rect width="880" height="410" rx="16" fill="url(#bg)"/>
  <rect width="880" height="410" rx="16" fill="url(#ambientGlow)"/>
  <rect x="0.5" y="0.5" width="879" height="409" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <!-- macOS translucent menu bar -->
  <path d="M16 1h848a15 15 0 0 1 15 15v18H1V16A15 15 0 0 1 16 1Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <line x1="1" y1="34" x2="879" y2="34" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- Left menu bar labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" fill="#E5E7EB" fill-opacity="0.72">
    <circle cx="26" cy="18" r="4.5" fill="#E5E7EB" fill-opacity="0.78"/>
    <text x="42" y="22" font-weight="600" fill-opacity="0.9">Xcode</text>
    <text x="92" y="22">File</text>
    <text x="125" y="22">Edit</text>
    <text x="160" y="22">View</text>
    <text x="201" y="22">Navigate</text>
  </g>

  <!-- Right menu bar status items -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" fill="#E5E7EB" fill-opacity="0.75">
    <text x="772" y="22" font-weight="500">Tue 9:41 PM</text>
  </g>

  <!-- Physical MacBook Notch (never widened) -->
  <path d="M342 0h196v22a12 12 0 0 1-12 12H354a12 12 0 0 1-12-12V0Z" fill="#000000"/>
  <circle cx="440" cy="14" r="4" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="440" cy="14" r="1.4" fill="#1E3A8A" fill-opacity="0.7"/>

  <!-- Notch Ping Bot Indicator beside the notch (Amber Needs-You + Blue Working Orbit Arc) -->
  <g transform="translate(556, 17)">
    <!-- Blue orbiting Working arc -->
    <circle cx="0" cy="0" r="11.2" fill="none" stroke="#61B8FF" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M 0 -11.2 A 11.2 11.2 0 0 1 10.6 -3.6" fill="none" stroke="#61B8FF" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Amber beacon wave -->
    <circle cx="0" cy="0" r="13.8" fill="none" stroke="#FFBF59" stroke-opacity="0.32" stroke-width="1.2"/>
    <!-- 16pt Lucide Bot -->
    <g transform="translate(-8.5, -9.2) scale(0.71)" stroke="#FFBF59" filter="url(#amberGlow)">
      <use href="#lucideBot"/>
    </g>
  </g>

  <!-- Dropdown Card revealed vertically below the menu bar -->
  <g transform="translate(272, 35)" filter="url(#cardShadow)">
    <rect width="336" height="226" rx="18" fill="#000000"/>
    <rect x="0.5" y="0.5" width="335" height="225" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.11"/>

    <!-- Header -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
      <text x="18" y="25" font-size="12" font-weight="600" fill="#F5F5F5">3 sessions (2 awaiting)</text>
      <text x="318" y="25" font-size="11" fill="#A6A6A6" text-anchor="end">Clear finished</text>
    </g>
    <line x1="0" y1="40" x2="336" y2="40" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <!-- Row 1: Claude Code - Needs you (Hovered) -->
    <g transform="translate(0, 40)">
      <rect width="336" height="52" fill="#1A1A1A"/>
      <rect x="18" y="18" width="16" height="16" rx="4" fill="#D97757" fill-opacity="0.18"/>
      <text x="26" y="30.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">*</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#F5F5F5">website</text>
      <text x="46" y="37" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#A6A6A6">Claude Code · feat/auth · 2m</text>
      <g transform="translate(230, 26)">
        <circle cx="0" cy="-3.5" r="5.2" fill="#FFBF59"/>
        <text x="0" y="-0.2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="800" fill="#000000" text-anchor="middle">?</text>
        <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#FFBF59">Needs you</text>
      </g>
    </g>

    <!-- Row 2: Codex - Finished -->
    <g transform="translate(0, 92)">
      <rect x="18" y="18" width="16" height="16" rx="4" fill="#61B8FF" fill-opacity="0.15"/>
      <text x="26" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#93C5FD" text-anchor="middle">&lt;/&gt;</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#F5F5F5">notch-ping</text>
      <text x="46" y="37" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#A6A6A6">Codex · main · just now</text>
      <g transform="translate(240, 26)">
        <circle cx="0" cy="-3.5" r="5.2" fill="#85DEA3"/>
        <path d="M-2.2 -3.5 L-0.6 -1.9 L2.4 -5.1" fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#85DEA3">Finished</text>
      </g>
      <text x="310" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#A6A6A6" text-anchor="middle">×</text>
    </g>

    <!-- Row 3: Antigravity - Working -->
    <g transform="translate(0, 144)">
      <rect x="18" y="18" width="16" height="16" rx="4" fill="#818CF8" fill-opacity="0.18"/>
      <circle cx="26" cy="26" r="4.5" fill="none" stroke="#A5B4FC" stroke-width="1.3"/>
      <circle cx="26" cy="26" r="1.5" fill="#A5B4FC"/>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#F5F5F5">infra</text>
      <text x="46" y="37" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#A6A6A6">Antigravity · refactor/deploy · 45s</text>
      <g transform="translate(242, 26)">
        <circle cx="0" cy="-3.5" r="4.8" fill="none" stroke="#61B8FF" stroke-opacity="0.25" stroke-width="1.3"/>
        <path d="M 0 -8.3 A 4.8 4.8 0 0 1 4.6 -2.1" fill="none" stroke="#61B8FF" stroke-width="1.4" stroke-linecap="round"/>
        <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#61B8FF">Working</text>
      </g>
    </g>

    <line x1="0" y1="196" x2="336" y2="196" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="168" y="215" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#A6A6A6" text-anchor="middle">Live sessions</text>
  </g>

  <!-- Bottom State Legend Bar -->
  <g transform="translate(76, 314)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
    <rect width="728" height="64" rx="14" fill="#05080F" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- State 1: Working -->
    <g transform="translate(36, 32)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#61B8FF" stroke-opacity="0.22" stroke-width="1.3"/>
      <path d="M 0 -11 A 11 11 0 0 1 10.4 -3.5" fill="none" stroke="#61B8FF" stroke-width="1.5" stroke-linecap="round"/>
      <g transform="translate(-8, -8.8) scale(0.67)" stroke="#61B8FF"><use href="#lucideBot"/></g>
      <text x="22" y="-3" font-size="12" font-weight="600" fill="#F3F4F6">Working</text>
      <text x="22" y="12" font-size="10.5" fill="#9CA3AF">Orbiting arc</text>
    </g>

    <!-- State 2: Needs you -->
    <g transform="translate(214, 32)">
      <circle cx="0" cy="0" r="12.5" fill="none" stroke="#FFBF59" stroke-opacity="0.38" stroke-width="1.3"/>
      <g transform="translate(-8, -8.8) scale(0.67)" stroke="#FFBF59"><use href="#lucideBot"/></g>
      <text x="22" y="-3" font-size="12" font-weight="600" fill="#F3F4F6">Needs you</text>
      <text x="22" y="12" font-size="10.5" fill="#9CA3AF">Wave + beacon</text>
    </g>

    <!-- State 3: Finished -->
    <g transform="translate(398, 32)">
      <circle cx="0" cy="0" r="11.5" fill="none" stroke="#85DEA3" stroke-opacity="0.45" stroke-width="1.3"/>
      <g transform="translate(-8, -8.8) scale(0.67)" stroke="#85DEA3"><use href="#lucideBot"/></g>
      <text x="22" y="-3" font-size="12" font-weight="600" fill="#F3F4F6">Finished</text>
      <text x="22" y="12" font-size="10.5" fill="#9CA3AF">Click opens &amp; clears</text>
    </g>

    <!-- State 4: Command failed -->
    <g transform="translate(578, 32)">
      <circle cx="0" cy="0" r="11.5" fill="none" stroke="#FF857D" stroke-opacity="0.42" stroke-width="1.3"/>
      <g transform="translate(-8, -8.8) scale(0.67)" stroke="#FF857D"><use href="#lucideBot"/></g>
      <text x="22" y="-3" font-size="12" font-weight="600" fill="#F3F4F6">Failed</text>
      <text x="22" y="12" font-size="10.5" fill="#9CA3AF">Alert shake</text>
    </g>
  </g>
</svg>
